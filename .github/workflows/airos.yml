# Builds air/OS packages (x86_64 and arm64) on every push to main and publishes
# them to the rolling "latest" release, with links in the README.
# The pipeline itself lives in airos-works/airos-ci; the air/OS images take Snap
# from its package pool.
name: air/OS build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  airos:
    uses: airos-works/airos-ci/.github/workflows/app.yml@main
    with:
      app: snap
      repo-dir: snap
    permissions:
      contents: write
